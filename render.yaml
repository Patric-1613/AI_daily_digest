services:
  - type: web
    name: ai-daily-digest-api
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --locked --no-dev --no-editable
    startCommand: ./scripts/start_render.sh
    healthCheckPath: /v1/health/live
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: PAGINATION_CURSOR_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-daily-digest-db
          property: connectionString
      - key: DOCS_ENABLED
        value: "true"

  - type: web
    name: ai-daily-digest-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: "/*"
        destination: /index.html

  # Team-approved paid resource (issue #53, extended by issue #113): one
  # Render cron service that now performs the full daily
  # ingestion -> intelligence orchestration, still within the one
  # originally approved cron service (no second cron, worker, disk, or
  # plan change). Render bills cron services by runtime with a minimum of
  # USD 1/month per service; the team approved that minimum. See
  # docs/DEPLOYMENT.md ("Combined daily pipeline") for the full outcome
  # table and exit-code contract.
  - type: cron
    name: ai-daily-digest-intelligence
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install uv && uv sync --locked --no-dev --no-editable
    # Render cron schedules are always interpreted in UTC. "0 6 * * *" == 06:00 UTC daily.
    schedule: "0 6 * * *"
    # Run the already-built production console script directly. `uv run` is
    # deliberately avoided: it can resynchronize the environment at runtime
    # (potentially pulling dev/editable deps) on every paid cron execution.
    #
    # `run-daily-digest` (src/ai_daily_digest/daily_pipeline.py) replaces the
    # old two-step `generate-digest --previous-complete-utc-day --since 24h
    # --limit 5` command. That command alone never collected sources, and
    # simply chaining `collect-rss-batch` in front of it would have been
    # silently wrong: snapshots collection creates in this run have
    # `fetched_at = now`, which falls in *today's* window, not the previous
    # completed UTC day `--previous-complete-utc-day` selects -- so the
    # freshly collected evidence would never be processed. `run-daily-digest`
    # instead collects the verified sources (openai_news, langchain_pypi,
    # langgraph_pypi) and then runs intelligence over the *real* collection
    # start/finish boundary it just recorded. It still caps intelligence at
    # 5 snapshots per run (same cost control as before) and never publishes
    # an empty digest -- a day with no new snapshots is a healthy no-op.
    startCommand: .venv/bin/run-daily-digest
    envVars:
      # Render's internal database reference -- the connection string is never
      # written here, in tests, or in docs. generate-digest reads DATABASE_URL
      # through shared.config.
      - key: DATABASE_URL
        fromDatabase:
          name: ai-daily-digest-db
          property: connectionString
      # Entered only in the Render dashboard for this cron service. Never
      # committed, printed, or logged.
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: ai-daily-digest-db
    plan: free
    databaseName: ai_daily_digest
    user: ai_daily_digest
