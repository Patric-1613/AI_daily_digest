name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_EDITABLE: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --no-editable
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pylint src/ai_daily_digest
      - run: uv build

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # docs/adr/0002-postgres-pgvector.md section 15: "the tests job gains
    # a postgres:17 service container (with a health check) ... CI
    # always runs the real integration suite; it is never skipped
    # there." -m "not live" below already includes -m integration, so no
    # separate step is needed to run it -- but the job (and therefore
    # this whole workflow run) must fail if the database cannot be
    # provisioned, which the health check below enforces before any
    # test step starts.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_daily_digest
          POSTGRES_PASSWORD: ai_daily_digest
          POSTGRES_DB: ai_daily_digest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_daily_digest -d ai_daily_digest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ai_daily_digest:ai_daily_digest@localhost:5432/ai_daily_digest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --no-editable
      - run: uv run pytest -m "not live" --cov-report=xml --cov-fail-under=80

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --no-editable
      - run: uv run bandit -c pyproject.toml -r src
      - run: uv run pip-audit .
