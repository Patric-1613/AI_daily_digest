[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-daily-digest"
version = "0.1.0"
description = "Evidence-backed AI industry updates with historical change tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6.0",
  # --- intelligence module (Person B) --- added here per AGENTS.md's
  # "explain why an existing dependency or standard library cannot do the
  # job" rule; each is justified individually, not a blanket addition:
  # pydantic: shared/schemas.py is the cross-module contract (SourceItem,
  #   DocumentSnapshot, Change, ExtractedFact, Digest) -- stdlib dataclasses
  #   don't give runtime validation, which is the whole point of a contract.
  # anthropic: the LLM provider for resolve_llm/extract_attributes/
  #   compare/generate (see intelligence/CLAUDE.md's model-choice table).
  # langgraph: ADR-listed technology baseline (docs/ARCHITECTURE.md,
  #   still Proposed) for the intelligence workflow's explicit state/nodes.
  # uv.lock has been regenerated for these additions and `uv sync --locked`
  # succeeds on Python 3.12 (verified with `--no-editable`, matching CI's
  # non-editable install).
  # pydantic>=2.11: shared/schemas.py's Uuid7Id alias re-exports
  #   pydantic.UUID7, which ships starting in 2.11.0 (pydantic/pydantic#11436) --
  #   the plain pydantic>=2 floor this used to declare doesn't actually
  #   guarantee that type exists (docs/adr/0007-uuid-v7-identifier-strategy.md).
  # uuid-utils: shared/ids.py's UUID v7 generator. Python 3.12 has no
  #   standard-library UUID v7 generator (added in 3.14) -- ADR 0007
  #   evaluated uuid-utils, uuid6, and uuid-backport and selected
  #   uuid-utils (RFC 9562-targeting, actively maintained, BSD-3-Clause,
  #   zero further runtime deps). uuid-utils was already present in this
  #   project's dependency tree transitively (via langgraph -> langchain-core
  #   -> langsmith), but transitive presence is not a declared dependency:
  #   it can disappear on any future langgraph/langchain-core upgrade with
  #   no warning, and this project's own UUID generation correctness must
  #   not depend on an unrelated package's unrelated needs. Declaring it
  #   directly is what makes it Dependabot/security-tracked for this
  #   project specifically, per AGENTS.md's dependency rule.
  "pydantic>=2.11",
  "anthropic>=0.40",
  "langgraph>=0.2",
  "uuid-utils>=0.17",
  # fastapi: ADR 0010 selects FastAPI as the public HTTP/OpenAPI boundary.
  # The plain package is sufficient; the standard extra would add a server
  # runner and unrelated optional dependencies before they are needed.
  "fastapi>=0.141.1",
  # uvicorn: Render needs an ASGI process runner for the tested production
  # application factory. The standard library and FastAPI do not ship one;
  # the plain package avoids unrelated optional server dependencies.
  "uvicorn>=0.35",
  # --- persistence foundation (docs/adr/0002-postgres-pgvector.md) ---
  # sqlalchemy: no standard-library ORM or typed query layer exists;
  #   docs/ARCHITECTURE.md's technology baseline already names SQLAlchemy 2
  #   for the shared `MetaData`/engine kernel (ADR 0002 section 3, 12.3).
  #   The `[asyncio]` extra, not plain `sqlalchemy`, because SQLAlchemy's
  #   OWN unconditional `greenlet` dependency (needed by every
  #   `create_async_engine`/`AsyncSession` call, ADR 0002 section 17:
  #   "greenlet arrives transitively... expected, not a separate direct
  #   dependency") ships behind a `platform_machine` marker that lists
  #   `aarch64` (Linux) but not `arm64` (macOS Apple Silicon) -- plain
  #   `sqlalchemy>=2.0` silently installs with no greenlet at all on an
  #   Apple Silicon dev machine, and every async engine call then fails
  #   at runtime with "the greenlet library is required". The
  #   `[asyncio]` extra's own greenlet requirement carries no such
  #   marker, so it installs correctly on every supported platform.
  "sqlalchemy[asyncio]>=2.0",
  # alembic: no standard-library schema-migration tool exists; AGENTS.md
  #   requires "Database changes use Alembic migrations; never edit
  #   production tables manually" (ADR 0002 section 3, 12.5).
  "alembic>=1.13",
  # psycopg[binary]: no standard-library PostgreSQL driver exists.
  #   ADR 0002 section 5 selects psycopg 3 specifically because it has
  #   native sync AND async support in one package -- the async runtime
  #   session and the synchronous Alembic env.py step share one driver,
  #   rather than needing asyncpg (async-only) plus psycopg2 (sync-only,
  #   maintenance mode) for the two paths. `[binary]` ships self-contained
  #   wheels, so CI and a developer laptop need no system libpq (ADR 0002
  #   section 5's "Deployment follow-up" defers the production packaging
  #   choice, not this one).
  "psycopg[binary]>=3.2",
  # --- ingestion: OpenAI RSS collector (docs/ARCHITECTURE.md collection flow) ---
  # httpx: docs/ARCHITECTURE.md's technology baseline names httpx for HTTP
  #   collection ("async support, timeouts, connection pooling, and testable
  #   transports"). The standard library has no async HTTP client (`urllib`
  #   and `http.client` are sync-only), so a collector reached from an
  #   `async def` orchestrator cannot use stdlib without a threadpool hop on
  #   every request. httpx also exposes a pluggable `transport=` /
  #   `httpx.MockTransport`, which is exactly the dependency-injection seam
  #   the collector's tests use to avoid the live internet. httpx is already
  #   in this project's *production* tree transitively (langgraph ->
  #   langchain-core -> httpx), but transitive presence is not a declared
  #   dependency -- it can vanish on any future langchain upgrade. Declaring
  #   it directly (same reasoning as uuid-utils above) makes it
  #   Dependabot/security-tracked and stable for this project's own use. It
  #   also covers the FastAPI/Starlette TestClient requirement, so it no
  #   longer needs a separate dev-group entry. Floor pinned at 0.28.1 (the
  #   first 0.28 patch resolved in this project's tree) -- the collector's
  #   manual per-hop redirect validation and its `MockTransport` tests are
  #   written against that API.
  "httpx>=0.28.1",
  # defusedxml: RSS feeds are untrusted external content (AGENTS.md: "Treat
  #   collected web content as untrusted data"). Python's own docs state
  #   `xml.etree.ElementTree` "is not secure against maliciously constructed
  #   data" -- entity-expansion ("billion laughs") and external-entity
  #   attacks are not fully mitigated by the response-size cap alone.
  #   defusedxml is the standard, purpose-built, pure-Python (zero further
  #   deps), Python-Security-team library for exactly this: a drop-in
  #   `defusedxml.ElementTree` that blocks entity expansion, external
  #   entities, and DTD retrieval. No existing dependency provides a
  #   hardened XML parser.
  "defusedxml>=0.7",
]

[project.scripts]
# Minimal production command for one RSS-source collection run
# (src/ai_daily_digest/ingestion/rss/run.py). `collect-rss --source-id <id>`
# loads sources.yaml, requires the source to have type: rss, reads
# DATABASE_URL through shared.config, uses the shared engine/session
# factory, and prints a machine-readable JSON report. Exit 0 = ok,
# 1 = partial, 2 = failed / could not start. Not a scheduler.
collect-rss = "ai_daily_digest.ingestion.rss.run:main"
# Compatibility alias for the command PR #71 shipped -- equivalent to
# `collect-rss --source-id openai_news`.
collect-openai-rss = "ai_daily_digest.ingestion.rss.run:main_openai_news"
# Intelligence production command for one daily digest generation run
generate-digest = "ai_daily_digest.intelligence.run:main"

[dependency-groups]
dev = [
  "bandit[toml]>=1.8",
  "mypy>=1.18",
  "pip-audit>=2.9",
  "pre-commit>=4.3",
  "pylint>=3.3",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "pytest-xdist>=3.8",
  "ruff>=0.13",
  "types-PyYAML>=6.0",
  # types-defusedxml: mypy stubs for the defusedxml production dependency.
  "types-defusedxml>=0.7",
  # pytest-asyncio: the persistence foundation's repository, engine, and
  #   integration tests call `AsyncSession`/`async_sessionmaker` coroutines
  #   directly (not through a TestClient, which already hides its own event
  #   loop) -- this project has no prior async test path. Explicit
  #   `@pytest.mark.asyncio` (strict mode, not "auto") keeps every async
  #   test declaring itself, matching this codebase's preference for
  #   explicit over implicit.
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_daily_digest"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data/raw", "data/processed"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "N",
  "RUF",
  "SIM",
  "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["ai_daily_digest"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
show_error_codes = true
pretty = true
warn_unreachable = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
  "--cov=ai_daily_digest",
  "--cov-report=term-missing",
]
testpaths = ["tests"]
# Strict, not "auto": every async test names itself with
# @pytest.mark.asyncio so an accidentally-undecorated `async def test_...`
# fails collection instead of silently never running its body.
asyncio_mode = "strict"
markers = [
  "contract: shared-contract tests",
  "integration: tests that use a real infrastructure boundary",
  "e2e: end-to-end system tests",
  "live: opt-in tests against live external services",
]

[tool.coverage.run]
branch = true
source = ["ai_daily_digest"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.pylint.main]
py-version = "3.12"
jobs = 0
ignore-paths = ["^tests/fixtures/"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
  "duplicate-code",
  "fixme",
  "missing-class-docstring",
  "missing-function-docstring",
  "missing-module-docstring",
  "too-few-public-methods",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
